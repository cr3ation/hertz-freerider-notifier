# Production: the code and the static files are in the image, Gunicorn serves the app.
# For development (source mounted, Django's dev server, debugpy) add compose.dev.yml:
#   docker compose -f docker-compose.yml -f compose.dev.yml up --build

# Settings shared by the app, the worker and beat
x-common-env: &common-env
  SECRET_KEY: ${SECRET_KEY}
  HERTZ_CHECK_INTERVAL: ${HERTZ_CHECK_INTERVAL}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASS: ${DB_PASS}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  CELERY_BROKER_URL: redis://redis:6379/0
  SITE_URL: ${SITE_URL:-}

# The three Django containers run the same image in different roles. They start once Postgres and Redis
# answer, and come back after a crash or a reboot.
x-django: &django
  build: .
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    <<: *django
    command: app
    environment:
      <<: *common-env
      DEBUG: ${DEBUG}
      HTTPS: ${HTTPS:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      PUSHOVER_USER: ${PUSHOVER_USER}
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
    ports:
      - "${APP_PORT:-8000}:8000"
  worker:
    <<: *django
    command: worker
    environment:
      <<: *common-env
      # The worker sends the notifications (scheduler.tasks.check_hertz)
      PUSHOVER_USER: ${PUSHOVER_USER}
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN}
  beat:
    <<: *django
    command: beat
    environment:
      <<: *common-env
volumes:
  postgres_data:
